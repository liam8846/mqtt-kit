  <text x="70" y="201" font-family="system-ui, sans-serif" font-size="24" fill="#adc3d3">Async MQTT. Built for Rust.</text>
  <text x="70" y="280" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="2" fill="#77ddc7">ONE API   /   TWO PROTOCOLS   /   YOUR RUNTIME</text>
