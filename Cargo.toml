[workspace]
members = ["crates/mqtt-kit-core", "crates/mqtt-kit"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"
repository = "https://github.com/liam8846/mqtt-kit"
keywords = ["mqtt", "async", "tokio", "iot", "pubsub"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
bytes = "1.10.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
rand = "0.9.2"
rumqttc = { version = "0.25.1", default-features = false }
rumqttd = { version = "0.20.0", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1.15.0", features = ["std"] }
thiserror = "2.0.12"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
url = "2.5.4"
webpki-roots = "1.0.10"
